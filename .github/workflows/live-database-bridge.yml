name: Live Database Bridge

on:
  push:
    paths:
      - 'database/requests/homepage-read.json'
  workflow_dispatch:
    inputs:
      request_json:
        description: 'JSON request (manual runs only)'
        required: false
        type: string
        default: '{"action":"ping"}'

permissions:
  contents: read

concurrency:
  group: expresshipping-live-db-bridge
  cancel-in-progress: false

jobs:
  database-request:
    name: Execute authenticated database request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out request file
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Prepare request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REQUEST: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            cp database/requests/homepage-read.json request.json
          else
            printf '%s' "$MANUAL_REQUEST" > request.json
          fi
          jq -e '
            type == "object" and
            (
              (.action == "ping")
              or
              (.action == "add_parcel_overlay" and .id == 6)
              or
              (.action == "fix_career_icons" and .id == 12)
              or
              (.action == "backup_page" and .id == 1)
              or
              (.action == "select" and
               (.sql == "SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1" or .sql == "SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"header\" LIMIT 1" or .sql == "SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"career\" LIMIT 1"))
              or
              (.action == "prepend_page_text" and .id == 1 and (.text | type == "string" and length > 0))
              or
              (.action == "replace_homepage_hero" and .id == 1 and
               (.hero_html | type == "string" and length > 0) and
               (.hero_css | type == "string" and length > 0) and
               (.hero_js | type == "string" and length > 0))
              or
              (.action == "update_page" and (.id == 1 or .id == 6 or .id == 12) and
               (.fields | type == "object" and length > 0 and
                (keys - ["Page_Contents", "styles_css", "script_js"] | length == 0) and
                all(.[]; type == "string")))
            )
          ' request.json >/dev/null
          echo "Request validated."

      - name: Call live database bridge
        env:
          DB_BRIDGE_URL: ${{ secrets.DB_BRIDGE_URL }}
          DB_BRIDGE_TOKEN: ${{ secrets.DB_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DB_BRIDGE_URL" || -z "$DB_BRIDGE_TOKEN" ]]; then
            echo "::error::Configure DB_BRIDGE_URL and DB_BRIDGE_TOKEN in repository Actions secrets."
            exit 1
          fi
          echo "::add-mask::$DB_BRIDGE_TOKEN"

          action="$(jq -r '.action' request.json)"
          if [[ "$action" == "fix_career_icons" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"career\" LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Careers page read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"]
          icons = {
              "bi bi-airplane": "fa-solid fa-plane",
              "bi bi-arrow-down-right": "fa-solid fa-arrow-down-right",
              "bi bi-arrow-right": "fa-solid fa-arrow-right",
              "bi bi-arrow-up-right": "fa-solid fa-arrow-up-right",
              "bi bi-box-seam": "fa-solid fa-box",
              "bi bi-briefcase": "fa-solid fa-briefcase",
              "bi bi-geo-alt": "fa-solid fa-location-dot",
              "bi bi-globe-americas": "fa-solid fa-earth-americas",
              "bi bi-globe2": "fa-solid fa-earth-americas",
              "bi bi-handshake": "fa-solid fa-handshake",
              "bi bi-info-circle": "fa-solid fa-circle-info",
              "bi bi-lightbulb": "fa-solid fa-lightbulb",
              "bi bi-people": "fa-solid fa-people-group",
          }
          for old, new in icons.items():
              html = html.replace('class="' + old + '"', 'class="' + new + '"')
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":12,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "add_parcel_overlay" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"header\" LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Shared header read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"] or ""
          if "eh-floating-parcel" in html:
              raise SystemExit("Floating parcel overlay already exists; refusing to add a duplicate.")
          overlay = r"""
          <div class="eh-floating-parcel" aria-hidden="true">
            <span class="eh-parcel-thread"></span><span class="eh-parcel-knot"></span>
            <svg class="eh-parcel-art" viewBox="0 0 88 82" role="presentation" focusable="false">
              <defs>
                <linearGradient id="ehParcelTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d9a4"/><stop offset="1" stop-color="#dba766"/></linearGradient>
                <linearGradient id="ehParcelLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d99b57"/><stop offset="1" stop-color="#b97739"/></linearGradient>
                <linearGradient id="ehParcelRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c88745"/><stop offset="1" stop-color="#965b2d"/></linearGradient>
              </defs>
              <path d="M44 5 82 25 44 45 6 25Z" fill="url(#ehParcelTop)" stroke="#9e6838" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M6 25 44 45 44 77 6 56Z" fill="url(#ehParcelLeft)" stroke="#965f32" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M44 45 82 25 82 56 44 77Z" fill="url(#ehParcelRight)" stroke="#87512a" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M36 9.2 51 17.1 36 25.1 21 17.1Z" fill="#f6e1bf" opacity=".95"/>
              <path d="M36 25.1 51 17.1 51 47.8 36 55.7Z" fill="#f1d7ad" opacity=".9"/>
              <path d="M44 45 44 77" stroke="#f1d7ad" stroke-width="3.4" opacity=".9"/>
              <path d="M6 25 44 45 82 25" fill="none" stroke="#f6d8a9" stroke-width="1.2" opacity=".8"/>
              <path d="M54 52 72 42" stroke="#f5d6a7" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
              <rect x="53" y="55" width="19" height="11" rx="2" fill="#fff8ed" transform="rotate(-27 53 55)"/>
              <path d="M58 58 67 53M58 61 64 58" stroke="#9c7048" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </div>
          """
          css = r"""
          /* Floating hanging parcel decoration */
          .eh-floating-parcel{position:fixed;top:0;right:clamp(18px,7.5vw,112px);z-index:1002;width:88px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:ehParcelSwing 5.2s ease-in-out infinite alternate;pointer-events:none;user-select:none;filter:drop-shadow(0 9px 9px rgba(34,47,57,.13))}
          .eh-parcel-thread{display:block;width:1.5px;height:112px;background:linear-gradient(180deg,rgba(91,105,115,.48),rgba(91,105,115,.82));box-shadow:0 0 1px rgba(255,255,255,.8)}
          .eh-parcel-knot{display:block;width:6px;height:6px;margin-top:-1px;border-radius:50%;background:#a36b39;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
          .eh-parcel-art{display:block;width:82px;height:77px;margin-top:-1px;overflow:visible}
          @keyframes ehParcelSwing{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}
          @media(max-width:767.98px){.eh-floating-parcel{right:14px;width:72px}.eh-parcel-art{width:68px;height:64px}.eh-parcel-thread{height:91px}}
          @media(prefers-reduced-motion:reduce){.eh-floating-parcel{animation:none}}
          """
          if "</header>" not in html or "</style>" not in html:
              raise SystemExit("Expected shared header markup/style was not found; no database update sent.")
          html = html.replace("</header>", "</header>\n" + overlay, 1)
          pos = html.rfind("</style>")
          html = html[:pos] + css + "\n" + html[pos:]
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":6,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "replace_homepage_hero" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              current = json.load(f)["rows"][0]
          with open("request.json", encoding="utf-8") as f:
              request = json.load(f)
          html = current["Page_Contents"]
          html = re.sub(r"^God is good\r?\n", "", html, count=1)
          start = html.find('<section class="eh-hero">')
          if start < 0:
              raise SystemExit("Could not locate the existing homepage hero section; no update was sent.")
          end_marker = "</section>"
          end = html.find(end_marker, start)
          if end < 0:
              raise SystemExit("Could not locate the end of the existing homepage hero section; no update was sent.")
          end += len(end_marker)
          html = html[:start] + request["hero_html"] + html[end:]
          css = current.get("styles_css") or ""
          css += "\n\n/* Expresshiping homepage advertising carousel */\n" + request["hero_css"]
          js = request["hero_js"]
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":1,"fields":{"Page_Contents":html,"styles_css":css,"script_js":js}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "prepend_page_text" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            existing="$(jq -r '.rows[0].Page_Contents' current.json)"
            prefix="$(jq -r '.text' request.json)"
            updated="$(printf '%s\n%s' "$prefix" "$existing")"
            jq -n --arg contents "$updated" '{action:"update_page",id:1,fields:{Page_Contents:$contents}}' > update-request.json
            mv update-request.json request.json
          fi

          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary @request.json)"
          echo "HTTP status: $status"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Database bridge returned HTTP $status."
            exit 1
          fi
          jq -e '.ok == true' response.json >/dev/null || {
            echo "::error::Database bridge did not confirm success."
            exit 1
          }
          jq -c '{ok, message, record_id, backup_id, updated_fields, affected_rows, error}' response.json >> "$GITHUB_STEP_SUMMARY"
          echo "Database bridge confirmed success."

      - name: Store private response artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-database-response
          path: response.json
          retention-days: 1
          if-no-files-found: error
