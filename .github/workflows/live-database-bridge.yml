name: Live Database Bridge

on:
  push:
    paths:
      - 'database/requests/homepage-read.json'
  workflow_dispatch:
    inputs:
      request_json:
        description: 'JSON request (manual runs only)'
        required: false
        type: string
        default: '{"action":"ping"}'

permissions:
  contents: read

concurrency:
  group: expresshipping-live-db-bridge
  cancel-in-progress: false

jobs:
  database-request:
    name: Execute authenticated database request
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out request file
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Prepare request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_REQUEST: ${{ inputs.request_json }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            cp database/requests/homepage-read.json request.json
          else
            printf '%s' "$MANUAL_REQUEST" > request.json
          fi
          jq -e '
            type == "object" and
            (
              (.action == "ping")
              or
              (.action == "insert_language_translator" and .id == 1)
              or
              (.action == "enhance_language_translator" and .id == 1)
              or
              (.action == "add_parcel_overlay" and .id == 6)
              or
              (.action == "upgrade_parcel_overlay" and .id == 6)
              or
              (.action == "shorten_parcel_rope" and .id == 6)
              or
              (.action == "replace_air_carousel_image" and .id == 1)
              or
              (.action == "fix_career_icons" and .id == 12)
              or
              (.action == "backup_page" and .id == 1)
              or
              (.action == "select" and
               (.sql == "SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1" or .sql == "SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"header\" LIMIT 1" or .sql == "SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"career\" LIMIT 1"))
              or
              (.action == "prepend_page_text" and .id == 1 and (.text | type == "string" and length > 0))
              or
              (.action == "replace_homepage_hero" and .id == 1 and
               (.hero_html | type == "string" and length > 0) and
               (.hero_css | type == "string" and length > 0) and
               (.hero_js | type == "string" and length > 0))
              or
              (.action == "update_page" and (.id == 1 or .id == 6 or .id == 12) and
               (.fields | type == "object" and length > 0 and
                (keys - ["Page_Contents", "styles_css", "script_js"] | length == 0) and
                all(.[]; type == "string")))
            )
          ' request.json >/dev/null
          echo "Request validated."

      - name: Call live database bridge
        env:
          DB_BRIDGE_URL: ${{ secrets.DB_BRIDGE_URL }}
          DB_BRIDGE_TOKEN: ${{ secrets.DB_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DB_BRIDGE_URL" || -z "$DB_BRIDGE_TOKEN" ]]; then
            echo "::error::Configure DB_BRIDGE_URL and DB_BRIDGE_TOKEN in repository Actions secrets."
            exit 1
          fi
          echo "::add-mask::$DB_BRIDGE_TOKEN"

          action="$(jq -r '.action' request.json)"
          if [[ "$action" == "fix_career_icons" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"career\" LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Careers page read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"]
          icons = {
              "bi bi-airplane": "fa-solid fa-plane",
              "bi bi-arrow-down-right": "fa-solid fa-arrow-down-right",
              "bi bi-arrow-right": "fa-solid fa-arrow-right",
              "bi bi-arrow-up-right": "fa-solid fa-arrow-up-right",
              "bi bi-box-seam": "fa-solid fa-box",
              "bi bi-briefcase": "fa-solid fa-briefcase",
              "bi bi-geo-alt": "fa-solid fa-location-dot",
              "bi bi-globe-americas": "fa-solid fa-earth-americas",
              "bi bi-globe2": "fa-solid fa-earth-americas",
              "bi bi-handshake": "fa-solid fa-handshake",
              "bi bi-info-circle": "fa-solid fa-circle-info",
              "bi bi-lightbulb": "fa-solid fa-lightbulb",
              "bi bi-people": "fa-solid fa-people-group",
          }
          for old, new in icons.items():
              html = html.replace('class="' + old + '"', 'class="' + new + '"')
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":12,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "enhance_language_translator" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          css = row.get("styles_css") or ""
          js = row.get("script_js") or ""
          if "ehGoogleTranslateElement" not in js:
              raise SystemExit("Homepage translator script not found; no update sent.")
          js, n = re.subn(r'\s*includedLanguages:\s*"[^"]*",\s*\n', '\n', js, count=1)
          css += r"""
          
          /* Hide the Google Translate top banner without disabling page translation. */
          html body{top:0!important}
          .goog-te-banner-frame.skiptranslate,
          iframe.goog-te-banner-frame{display:none!important;visibility:hidden!important;height:0!important;max-height:0!important}
          body > .skiptranslate{display:none!important}
          #goog-gt-tt,.goog-te-balloon-frame{display:none!important}
          .goog-text-highlight{background:transparent!important;box-shadow:none!important}
          """
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":1,"fields":{"styles_css":css,"script_js":js}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "insert_language_translator" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row.get("Page_Contents") or ""
          css = row.get("styles_css") or ""
          js = row.get("script_js") or ""
          marker = '<section class="eh-language-section"'
          if marker in html or "eh-language-translator" in css or "ehGoogleTranslateElement" in js:
              raise SystemExit("Language translator already exists; refusing to insert a duplicate.")
          section_start = html.find('<section class="eh-trust-strip">')
          if section_start < 0:
              raise SystemExit("The four-service trust strip was not found; no update sent.")
          section_end = html.find("</section>", section_start)
          if section_end < 0:
              raise SystemExit("The end of the four-service trust strip was not found; no update sent.")
          section_end += len("</section>")
          translator = r"""

          <section class="eh-language-section" aria-labelledby="eh-language-title">
            <div class="container">
              <div class="eh-language-panel">
                <div class="eh-language-copy">
                  <span class="eh-section-kicker">A WORLD WITHOUT LANGUAGE BARRIERS</span>
                  <h4 id="eh-language-title">Select your language</h4>
                  <p>Choose your preferred language to browse Expresshiping.</p>
                </div>
                <div class="eh-language-widget">
                  <span class="eh-language-icon" aria-hidden="true"><i class="fa-solid fa-globe"></i></span>
                  <div id="ehGoogleTranslateElement" aria-label="Choose website language"></div>
                </div>
              </div>
            </div>
          </section>
          """
          html = html[:section_end] + translator + html[section_end:]
          css += r"""

          /* Homepage language selector */
          .eh-home .eh-language-section{padding:30px 0 34px;background:#f4f8fb;border-bottom:1px solid #e5edf3}
          .eh-home .eh-language-panel{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:22px 26px;background:#fff;border:1px solid #e3ebf2;border-radius:14px;box-shadow:0 10px 28px rgba(9,40,63,.055)}
          .eh-home .eh-language-copy .eh-section-kicker{font-size:10px;letter-spacing:1.6px}
          .eh-home .eh-language-copy h4{margin:7px 0 4px;color:var(--eh-navy);font-size:20px;font-weight:800;letter-spacing:-.35px}
          .eh-home .eh-language-copy p{margin:0;color:var(--eh-muted);font-size:13px;line-height:1.6}
          .eh-home .eh-language-widget{display:flex;align-items:center;gap:12px;min-width:220px;padding:10px 14px;border:1px solid #dce7ef;border-radius:10px;background:#f9fbfd}
          .eh-home .eh-language-icon{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:#e7f2fa;color:var(--eh-blue);font-size:17px}
          .eh-home #ehGoogleTranslateElement{min-width:0}
          .eh-home #ehGoogleTranslateElement .goog-te-gadget{color:#607486;font-family:inherit;font-size:0}
          .eh-home #ehGoogleTranslateElement .goog-te-combo{max-width:100%;height:38px;margin:0;padding:0 28px 0 10px;border:0;border-radius:7px;background:transparent;color:var(--eh-ink);font-family:inherit;font-size:14px;outline-offset:3px}
          .eh-home #ehGoogleTranslateElement .goog-te-gadget span,.eh-home #ehGoogleTranslateElement .goog-logo-link{display:none!important}
          @media(max-width:575.98px){.eh-home .eh-language-section{padding:22px 0}.eh-home .eh-language-panel{align-items:stretch;flex-direction:column;padding:18px;gap:16px}.eh-home .eh-language-widget{width:100%;min-width:0}.eh-home #ehGoogleTranslateElement{flex:1}.eh-home #ehGoogleTranslateElement .goog-te-combo{width:100%}}
          """
          js += r"""

          /* Google website language translator */
          (function () {
            function initExpresshipingTranslator() {
              var target = document.getElementById("ehGoogleTranslateElement");
              if (!target || target.getAttribute("data-translate-ready") === "1") return;
              target.setAttribute("data-translate-ready", "1");
              window.googleTranslateElementInit = function () {
                if (!window.google || !window.google.translate || !window.google.translate.TranslateElement) return;
                new window.google.translate.TranslateElement({
                  pageLanguage: "en",
                  includedLanguages: "en,fr,es,de,pt,ar,zh-CN,ha,yo,ig,it,nl,ru,ja,ko,hi,sw",
                  autoDisplay: false
                }, "ehGoogleTranslateElement");
              };
              if (!document.querySelector('script[data-eh-google-translate]')) {
                var script = document.createElement("script");
                script.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
                script.async = true;
                script.setAttribute("data-eh-google-translate", "1");
                script.onerror = function () {
                  target.removeAttribute("data-translate-ready");
                  target.textContent = "Language translation is temporarily unavailable.";
                };
                document.head.appendChild(script);
              }
            }
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initExpresshipingTranslator);
            else initExpresshipingTranslator();
          })();
          """
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":1,"fields":{
                  "Page_Contents":html,
                  "styles_css":css,
                  "script_js":js
              }}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "add_parcel_overlay" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"header\" LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Shared header read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"] or ""
          if "eh-floating-parcel" in html:
              raise SystemExit("Floating parcel overlay already exists; refusing to add a duplicate.")
          overlay = r"""
          <div class="eh-floating-parcel" aria-hidden="true">
            <span class="eh-parcel-thread"></span><span class="eh-parcel-knot"></span>
            <svg class="eh-parcel-art" viewBox="0 0 88 82" role="presentation" focusable="false">
              <defs>
                <linearGradient id="ehParcelTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7d9a4"/><stop offset="1" stop-color="#dba766"/></linearGradient>
                <linearGradient id="ehParcelLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d99b57"/><stop offset="1" stop-color="#b97739"/></linearGradient>
                <linearGradient id="ehParcelRight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c88745"/><stop offset="1" stop-color="#965b2d"/></linearGradient>
              </defs>
              <path d="M44 5 82 25 44 45 6 25Z" fill="url(#ehParcelTop)" stroke="#9e6838" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M6 25 44 45 44 77 6 56Z" fill="url(#ehParcelLeft)" stroke="#965f32" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M44 45 82 25 82 56 44 77Z" fill="url(#ehParcelRight)" stroke="#87512a" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M36 9.2 51 17.1 36 25.1 21 17.1Z" fill="#f6e1bf" opacity=".95"/>
              <path d="M36 25.1 51 17.1 51 47.8 36 55.7Z" fill="#f1d7ad" opacity=".9"/>
              <path d="M44 45 44 77" stroke="#f1d7ad" stroke-width="3.4" opacity=".9"/>
              <path d="M6 25 44 45 82 25" fill="none" stroke="#f6d8a9" stroke-width="1.2" opacity=".8"/>
              <path d="M54 52 72 42" stroke="#f5d6a7" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
              <rect x="53" y="55" width="19" height="11" rx="2" fill="#fff8ed" transform="rotate(-27 53 55)"/>
              <path d="M58 58 67 53M58 61 64 58" stroke="#9c7048" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </div>
          """
          css = r"""
          /* Floating hanging parcel decoration */
          .eh-floating-parcel{position:fixed;top:0;right:clamp(18px,7.5vw,112px);z-index:1002;width:88px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:ehParcelSwing 5.2s ease-in-out infinite alternate;pointer-events:none;user-select:none;filter:drop-shadow(0 9px 9px rgba(34,47,57,.13))}
          .eh-parcel-thread{display:block;width:1.5px;height:112px;background:linear-gradient(180deg,rgba(91,105,115,.48),rgba(91,105,115,.82));box-shadow:0 0 1px rgba(255,255,255,.8)}
          .eh-parcel-knot{display:block;width:6px;height:6px;margin-top:-1px;border-radius:50%;background:#a36b39;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
          .eh-parcel-art{display:block;width:82px;height:77px;margin-top:-1px;overflow:visible}
          @keyframes ehParcelSwing{0%{transform:rotate(-5deg)}100%{transform:rotate(5deg)}}
          @media(max-width:767.98px){.eh-floating-parcel{right:14px;width:72px}.eh-parcel-art{width:68px;height:64px}.eh-parcel-thread{height:91px}}
          @media(prefers-reduced-motion:reduce){.eh-floating-parcel{animation:none}}
          """
          if "</header>" not in html or "</style>" not in html:
              raise SystemExit("Expected shared header markup/style was not found; no database update sent.")
          html = html.replace("</header>", "</header>\n" + overlay, 1)
          pos = html.rfind("</style>")
          html = html[:pos] + css + "\n" + html[pos:]
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":6,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "upgrade_parcel_overlay" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"header\" LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Shared header read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"] or ""
          if 'class="eh-floating-parcel"' not in html or "/* Floating hanging parcel decoration */" not in html:
              raise SystemExit("Existing parcel overlay was not found; refusing to make an unrelated change.")
          start = html.index('<div class="eh-floating-parcel"')
          end = html.index('</div>', start) + len('</div>')
          overlay = r"""
          <div class="eh-floating-parcel" aria-hidden="true">
            <span class="eh-parcel-thread"></span>
            <span class="eh-parcel-knot"></span>
            <svg class="eh-parcel-art" viewBox="0 0 180 166" role="presentation" focusable="false">
              <defs>
                <linearGradient id="ehCartonFront" x1="0" y1="0" x2="0.15" y2="1"><stop offset="0" stop-color="#d9a66c"/><stop offset="1" stop-color="#a96f3d"/></linearGradient>
                <linearGradient id="ehCartonSide" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c58b50"/><stop offset="1" stop-color="#80502e"/></linearGradient>
                <linearGradient id="ehCartonFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edc58f"/><stop offset="1" stop-color="#bd8954"/></linearGradient>
                <linearGradient id="ehPackingTape" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f8e7c5"/><stop offset=".5" stop-color="#fff3d9"/><stop offset="1" stop-color="#d9b783"/></linearGradient>
                <filter id="ehBoxShadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="4"/></filter>
              </defs>
              <ellipse cx="91" cy="151" rx="65" ry="10" fill="#263746" opacity=".18" filter="url(#ehBoxShadow)"/>
              <!-- Open carton flaps, visible around the taped top -->
              <path d="M24 49 72 25 91 40 46 69Z" fill="url(#ehCartonFlap)" stroke="#8f5d35" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M91 40 135 17 164 39 111 68Z" fill="#e5b77f" stroke="#8f5d35" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M24 49 9 27 63 7 82 27Z" fill="#c58d56" stroke="#8f5d35" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M111 68 164 39 173 61 119 91Z" fill="#d6a16a" stroke="#8f5d35" stroke-width="1.8" stroke-linejoin="round"/>
              <!-- Main carton body -->
              <path d="M24 49 91 83 91 153 24 118Z" fill="url(#ehCartonFront)" stroke="#80502e" stroke-width="2" stroke-linejoin="round"/>
              <path d="M91 83 164 46 164 117 91 153Z" fill="url(#ehCartonSide)" stroke="#704528" stroke-width="2" stroke-linejoin="round"/>
              <path d="M24 49 91 14 164 46 91 83Z" fill="#d8a46c" stroke="#80502e" stroke-width="2" stroke-linejoin="round"/>
              <!-- Top seam and wide packing tape -->
              <path d="M91 14 91 83" stroke="#98663c" stroke-width="1.7" opacity=".8"/>
              <path d="M78 20 105 32 105 75 78 62Z" fill="url(#ehPackingTape)" stroke="#c4a477" stroke-width="1.2"/>
              <path d="M78 20 91 13 118 26 105 32Z" fill="#fff0d0" stroke="#c4a477" stroke-width="1.1"/>
              <path d="M78 62 91 69 105 62" fill="none" stroke="#b68d5b" stroke-width="1.2" opacity=".75"/>
              <!-- Corrugation folds, carton edges and shipping label -->
              <path d="M30 55 30 113M37 59 37 117" stroke="#f0c58f" stroke-width="1" opacity=".28"/>
              <path d="M158 50 158 113" stroke="#f5d5a8" stroke-width="1.2" opacity=".3"/>
              <path d="M111 91 150 71 150 98 111 118Z" fill="#fffaf0" stroke="#d9c6a9" stroke-width="1.3"/>
              <path d="M118 94 141 82M118 99 139 88M118 104 132 97" stroke="#927657" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M117 111 140 99" stroke="#252525" stroke-width="2.2" stroke-dasharray="2 2"/>
              <path d="M91 83 91 153" stroke="#f3d0a1" stroke-width="2" opacity=".35"/>
              <path d="M24 49 91 83 164 46" fill="none" stroke="#f4d4a8" stroke-width="1.1" opacity=".45"/>
            </svg>
          </div>
          """
          html = html[:start] + overlay + html[end:]
          css = r"""
          /* Floating hanging parcel decoration */
          .eh-floating-parcel{position:fixed;top:0;right:clamp(22px,8vw,124px);z-index:1002;width:180px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:ehParcelSwing 5.8s ease-in-out infinite alternate;pointer-events:none;user-select:none;filter:drop-shadow(0 13px 13px rgba(34,47,57,.2))}
          .eh-parcel-thread{display:block;width:2px;height:60vh;background:linear-gradient(180deg,rgba(91,105,115,.38),rgba(91,105,115,.9));box-shadow:0 0 2px rgba(255,255,255,.9)}
          .eh-parcel-knot{display:block;width:8px;height:8px;margin-top:-1px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c28f,#89572f 75%);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
          .eh-parcel-art{display:block;width:176px;height:162px;margin-top:-2px;overflow:visible}
          @keyframes ehParcelSwing{0%{transform:rotate(-4.5deg)}100%{transform:rotate(4.5deg)}}
          @media(max-width:767.98px){.eh-floating-parcel{right:12px;width:126px}.eh-parcel-thread{height:60vh}.eh-parcel-art{width:122px;height:112px}}
          @media(prefers-reduced-motion:reduce){.eh-floating-parcel{animation:none}}
          """
          html, n = re.subn(r'/\* Floating hanging parcel decoration \*/.*?(?=\n</style>)', css.strip(), html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Could not safely locate the existing parcel CSS block.")
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":6,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi


          if [[ "$action" == "shorten_parcel_rope" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE link = \"header\" LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Shared header read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"] or ""
          if 'class="eh-floating-parcel"' not in html:
              raise SystemExit("Floating parcel overlay not found; no update sent.")
          css_start = html.find("/* Floating hanging parcel decoration */")
          css_end = html.find("</style>", css_start)
          if css_start < 0 or css_end < 0:
              raise SystemExit("Parcel overlay CSS block not found; no update sent.")
          css = html[css_start:css_end]
          css_new, count = re.subn(r'height:60vh', 'height:40vh', css)
          if count < 1:
              raise SystemExit("Expected 60vh rope height was not found; no update sent.")
          html = html[:css_start] + css_new + html[css_end:]
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":6,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi


          if [[ "$action" == "replace_air_carousel_image" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json
          with open("current.json", encoding="utf-8") as f:
              row = json.load(f)["rows"][0]
          html = row["Page_Contents"] or ""
          old = "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2000&q=88"
          new = "https://images.pexels.com/photos/11242682/pexels-photo-11242682.jpeg?auto=compress&dpr=1&h=750&w=1260"
          if old not in html:
              raise SystemExit("Expected first carousel image URL not found; no update sent.")
          html = html.replace(old, new, 1)
          html = html.replace('alt="Commercial aircraft flying above the clouds"', 'alt="Full cargo aircraft parked on an airport tarmac"', 1)
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":1,"fields":{"Page_Contents":html}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "replace_homepage_hero" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            python3 - <<'PY'
          import json, re
          with open("current.json", encoding="utf-8") as f:
              current = json.load(f)["rows"][0]
          with open("request.json", encoding="utf-8") as f:
              request = json.load(f)
          html = current["Page_Contents"]
          html = re.sub(r"^God is good\r?\n", "", html, count=1)
          start = html.find('<section class="eh-hero">')
          if start < 0:
              raise SystemExit("Could not locate the existing homepage hero section; no update was sent.")
          end_marker = "</section>"
          end = html.find(end_marker, start)
          if end < 0:
              raise SystemExit("Could not locate the end of the existing homepage hero section; no update was sent.")
          end += len(end_marker)
          html = html[:start] + request["hero_html"] + html[end:]
          css = current.get("styles_css") or ""
          css += "\n\n/* Expresshiping homepage advertising carousel */\n" + request["hero_css"]
          js = request["hero_js"]
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump({"action":"update_page","id":1,"fields":{"Page_Contents":html,"styles_css":css,"script_js":js}}, f, ensure_ascii=False)
          PY
          fi

          if [[ "$action" == "prepend_page_text" ]]; then
            read_request='{"action":"select","sql":"SELECT id, Page_Name, link, type, Page_Contents, styles_css, script_js FROM pages WHERE id = 1 LIMIT 1"}'
            read_status="$(curl --silent --show-error --output current.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary "$read_request")"
            if [[ ! "$read_status" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::Homepage read failed with HTTP $read_status."
              exit 1
            fi
            jq -e '.ok == true and (.rows | length == 1)' current.json >/dev/null
            existing="$(jq -r '.rows[0].Page_Contents' current.json)"
            prefix="$(jq -r '.text' request.json)"
            updated="$(printf '%s\n%s' "$prefix" "$existing")"
            jq -n --arg contents "$updated" '{action:"update_page",id:1,fields:{Page_Contents:$contents}}' > update-request.json
            mv update-request.json request.json
          fi

          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' --request POST "$DB_BRIDGE_URL" --header "Authorization: Bearer $DB_BRIDGE_TOKEN" --header 'Content-Type: application/json' --data-binary @request.json)"
          echo "HTTP status: $status"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Database bridge returned HTTP $status."
            exit 1
          fi
          jq -e '.ok == true' response.json >/dev/null || {
            echo "::error::Database bridge did not confirm success."
            exit 1
          }
          jq -c '{ok, message, record_id, backup_id, updated_fields, affected_rows, error}' response.json >> "$GITHUB_STEP_SUMMARY"
          echo "Database bridge confirmed success."

      - name: Store private response artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-database-response
          path: response.json
          retention-days: 1
          if-no-files-found: error
